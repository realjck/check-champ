<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CheckChamp</title>
    <script>
      // Apply the theme before first paint to avoid a light flash; mirrors the store default.
      try {
        const saved = JSON.parse(localStorage.getItem('shopping-list-storage'))?.state?.isDarkMode;
        const dark = saved ?? matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch {
        // Unreadable storage: React applies the theme after mount.
      }
    </script>
    <meta name="description" content="Organisez votre quotidien avec CheckChamp : listes de courses, listes de tâches et plus encore.">
    <meta name="theme-color" content="#fa6c08">
    <link rel="icon" href="/src/assets/images/favicon.ico" sizes="any">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
